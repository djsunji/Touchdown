<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="public/logo-icon.png">
<title>Touchdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Varela+Round&display=swap">
<style>
/* Layout: app shell, sticky navy header, category sidebar (chips on phones), list of tip cards */
:root {
  --brand: #0a2148;
  --brand-light: #2f7fd0;
  --brand-fg: #ffffff;
  --accent: #d4a017;
  --bg: #f2f4f7;
  --surface: #ffffff;
  --fg: #1d2733;
  --muted: #64707d;
  --line: #e2e6eb;
  --hover: #f5f7f9;
  --active: #e9edf2;
  --danger: #c0352b;
  --heart: #e0455a;
  --off: #c9cfd6;
  --warn-bg: #fff6dd;
  --warn-fg: #7a5a00;
  --display: "Barlow Condensed", "Arial Narrow", ui-sans-serif, system-ui, sans-serif;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: #0f2c5c; --brand-fg: #ffffff; --accent: #e6b830;
    --bg: #0f151c; --surface: #18212b; --fg: #e4e9ef; --muted: #98a3af;
    --line: #2a3542; --hover: #1f2a36; --active: #253242; --danger: #ef6b60;
    --heart: #f0687b; --off: #46525f; --warn-bg: #3a2f0f; --warn-fg: #f2d27a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand: #0f2c5c; --brand-fg: #ffffff; --accent: #e6b830;
  --bg: #0f151c; --surface: #18212b; --fg: #e4e9ef; --muted: #98a3af;
  --line: #2a3542; --hover: #1f2a36; --active: #253242; --danger: #ef6b60;
  --heart: #f0687b; --off: #46525f; --warn-bg: #3a2f0f; --warn-fg: #f2d27a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.preview-note { background: var(--warn-bg); color: var(--warn-fg); font-size: 13px; padding: 6px 16px; text-align: center; }

/* Brand */
.brand { display: inline-flex; align-items: center; gap: 10px; }
.brand-ico { display: block; background: #fff; border-radius: 8px; padding: 2px; box-sizing: content-box; }
.wordmark { font-family: "Varela Round", ui-rounded, system-ui, sans-serif; font-weight: 400; font-size: 21px; letter-spacing: -.01em; }
.wordmark span { color: var(--brand-light); font-weight: 400; opacity: 1; }
.top button.back { display: flex; align-items: center; gap: 8px; padding: 2px 6px; }
@media (max-width: 520px) { .back-txt { display: none; } }
.login-icon { display: block; margin: 0 auto; width: 96px; height: 96px; }
.login-card h1.login-word { margin: 0; font-size: 44px; line-height: 1.05; color: var(--brand); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .login-card h1.login-word { color: var(--fg); } }
:root[data-theme="dark"] .login-card h1.login-word { color: var(--fg); }

/* Login */
.login { min-height: 100%; display: grid; place-items: center; background: var(--brand); padding: 32px 16px; }
.login-card { width: 100%; max-width: 360px; background: var(--surface); border-radius: 14px; padding: 32px; box-shadow: 0 20px 50px rgba(0,0,0,.3); text-align: center; display: grid; gap: 8px; }
.login-card h1 { margin: 8px 0 0; font-size: 24px; color: var(--fg); }
.login-card p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
.moon { font-size: 40px; line-height: 1; }
.ms-btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 12px 16px; border: 0; border-radius: 8px; background: #2f2f2f; color: #fff; font-weight: 600; }
.ms-btn:hover { background: #111; }

/* Shell */
.app { min-height: 100%; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--brand); color: var(--brand-fg); box-shadow: 0 2px 6px rgba(0,0,0,.15); }
.top-inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; }
.top button.link { background: none; border: 0; color: inherit; padding: 4px 8px; border-radius: 6px; font-size: 14px; }
.top button.link:hover { background: rgba(255,255,255,.12); }
.brand-title { font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-title span { font-weight: 400; opacity: .8; }
.user { display: flex; align-items: center; gap: 12px; font-size: 14px; }
.user .name { opacity: .85; }
.outline-btn { background: none; border: 1px solid rgba(255,255,255,.45); color: inherit; border-radius: 6px; padding: 4px 12px; font-size: 14px; }
.outline-btn:hover { background: rgba(255,255,255,.12); }

.body { flex: 1; display: flex; min-width: 0; }
.side { width: 270px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--line); }
.side h2 { margin: 0; padding: 20px 20px 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.side ul { list-style: none; margin: 0; padding: 0; }
.side button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 20px; border: 0; background: none; text-align: left; }
.side button:hover { background: var(--hover); }
.side button.on { background: var(--active); font-weight: 600; }
.side .ico { width: 24px; text-align: center; }
.side .lbl { flex: 1; }
.count { background: var(--active); color: var(--muted); border-radius: 999px; padding: 1px 8px; font-size: 12px; font-variant-numeric: tabular-nums; }
.side button.on .count { background: var(--surface); }
.chips { display: none; gap: 8px; overflow-x: auto; padding: 12px 16px; }
.chips button { flex-shrink: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
.chips button.on { background: var(--brand); color: var(--brand-fg); border-color: var(--brand); }
main { flex: 1; min-width: 0; padding: 24px 32px 48px; }
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 16px; }

@media (max-width: 760px) {
  .body { flex-direction: column; }
  .side { display: none; }
  .chips { display: flex; }
  main { padding: 8px 16px 40px; }
  .user .name { display: none; }
}

/* Home */
.hero { position: relative; overflow: hidden; background: linear-gradient(180deg, #071426 0%, var(--brand) 100%); color: #fff; padding-block: 40px 88px; padding-inline: 16px; }
.hero::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(1px 1px at 12% 30%, #fff9 50%, transparent 51%), radial-gradient(1px 1px at 28% 70%, #fff6 50%, transparent 51%), radial-gradient(1.5px 1.5px at 46% 22%, #fffa 50%, transparent 51%), radial-gradient(1px 1px at 63% 58%, #fff7 50%, transparent 51%), radial-gradient(1px 1px at 78% 18%, #fff9 50%, transparent 51%), radial-gradient(1.5px 1.5px at 90% 64%, #fff8 50%, transparent 51%), radial-gradient(1px 1px at 8% 82%, #fff5 50%, transparent 51%), radial-gradient(1px 1px at 54% 86%, #fff5 50%, transparent 51%); pointer-events: none; }
.hero-inner { position: relative; max-width: 1080px; margin: 0 auto; display: grid; gap: 10px; }
.eyebrow { font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
.hero h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(36px, 7vw, 64px); line-height: .95; letter-spacing: .01em; text-wrap: balance; }
.hero p { margin: 0; max-width: 46ch; color: #ffffffc0; font-size: 15px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-top: 8px; font-family: var(--display); font-size: 18px; font-weight: 600; letter-spacing: .04em; }
.stats b { font-size: 26px; color: var(--accent); margin-right: 6px; font-variant-numeric: tabular-nums; }
.home { width: 100%; max-width: 1112px; margin: -60px auto 0; padding-inline: 16px; padding-block: 0 56px; position: relative; }
/* flex so an incomplete last row sits centred */
.dest-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
.dest-grid > .dest { width: calc((100% - 16px) / 2); }
@media (min-width: 700px) { .dest-grid { gap: 20px; } .dest-grid > .dest { width: calc((100% - 40px) / 3); } }
@media (min-width: 980px) { .dest-grid > .dest { width: calc((100% - 60px) / 4); } }
@media (min-width: 1100px) { .dest-grid > .dest { width: calc((100% - 80px) / 5); } }
.dest { position: relative; display: block; aspect-ratio: 4 / 5; max-width: 100%; border: 0; padding: 0; border-radius: 18px; overflow: hidden; color: #fff; text-align: left; box-shadow: 0 10px 30px rgba(4, 14, 28, .28); transition: transform .25s ease, box-shadow .25s ease; isolation: isolate; }
.dest .art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: -1; }
.dest .sil { transition: transform .4s ease; transform-origin: 50% 100%; }
.dest::after { content: ""; position: absolute; inset: auto 0 0 0; height: 45%; background: linear-gradient(180deg, transparent, rgba(0,0,0,.55)); z-index: -1; }
.dest:hover, .dest:focus-visible { transform: translateY(-6px); box-shadow: 0 18px 40px rgba(4, 14, 28, .4); }
.dest:hover .sil, .dest:focus-visible .sil { transform: translate(0,150px) scale(1.04); }
.dest .top-txt { position: absolute; left: 18px; right: 18px; top: 14px; display: grid; gap: 0; }
.dest .code { font-family: var(--display); font-weight: 800; font-size: clamp(42px, 9vw, 58px); line-height: 1; letter-spacing: .05em; text-shadow: 0 2px 12px rgba(0,0,0,.25); }
.dest .city { font-weight: 700; font-size: 17px; line-height: 1.2; }
.dest .country { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
.dest .bottom-txt { position: absolute; left: 14px; right: 14px; bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dest .pill { background: rgba(255,255,255,.18); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid rgba(255,255,255,.28); border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dest .landmark { font-size: 11px; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
.dest .go { font-size: 18px; line-height: 1; transition: transform .25s ease; }
.dest:hover .go { transform: translateX(3px); }
@media (max-width: 520px) { .dest .landmark { display: none; } .dest .city { font-size: 15px; } }
@media (prefers-reduced-motion: reduce) { .dest, .dest .sil, .dest .go { transition: none; } .dest:hover, .dest:hover .sil { transform: none; } }

/* Destination overview */
.dest-head { display: flex; align-items: center; gap: 16px; }
.dest-code { font-family: var(--display); font-weight: 800; font-size: 56px; line-height: 1; letter-spacing: .04em; color: var(--brand); }
:root[data-theme="dark"] .dest-code { color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dest-code { color: var(--accent); } }
.feat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.feat { position: relative; overflow: hidden; text-align: left; border: 0; border-radius: 16px; padding: 20px; min-height: 200px; color: #fff; display: flex; flex-direction: column; gap: 4px; background: linear-gradient(var(--rot), var(--c1), var(--c2)); box-shadow: 0 8px 22px rgba(4, 14, 28, .18); transition: transform .2s ease, box-shadow .2s ease; }
.feat::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.35)); pointer-events: none; }
.feat > * { position: relative; z-index: 1; }
.feat:hover, .feat:focus-visible { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(4, 14, 28, .28); }
.feat-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.feat-ico { font-size: 40px; line-height: 1; }
.feat-n { background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.feat-lbl { margin-top: 10px; font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.05; text-wrap: balance; }
.feat-hint { font-size: 13px; opacity: .85; }
.feat-tops { margin-top: auto; padding-top: 12px; display: grid; gap: 2px; font-size: 13px; min-width: 0; }
.feat-tops .feat-top { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feat-tops .feat-top b { color: #ffe08a; }
.feat-tops .muted { opacity: .8; font-style: italic; }
.more-h { margin: 8px 0 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
@media (max-width: 520px) { .feat { min-height: 170px; padding: 14px; } .feat-ico { font-size: 30px; } .feat-lbl { font-size: 22px; } .feat-hint { display: none; } .dest-code { font-size: 44px; } }
@media (prefers-reduced-motion: reduce) { .feat { transition: none; } .feat:hover { transform: none; } }
.cat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 700px) { .cat-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.cat-tile { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; }
.cat-tile:hover { background: var(--hover); }
.cat-tile .ico { font-size: 22px; }
.cat-tile .lbl { font-size: 14px; font-weight: 600; }
.cat-tile .n { font-size: 12px; color: var(--muted); }
h1.page { margin: 0; font-size: 24px; text-wrap: balance; }
p.lead { margin: 0; color: var(--muted); }

/* List */
.list-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.primary { border: 0; background: var(--brand); color: var(--brand-fg); border-radius: 8px; padding: 9px 16px; font-weight: 600; font-size: 14px; flex-shrink: 0; }
.primary:hover { filter: brightness(1.15); }
.tools { display: flex; gap: 12px; flex-wrap: wrap; }
.tabs { flex: 1 1 380px; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.tabs button { border: 0; background: none; padding: 10px 6px; font-size: 14px; }
.tabs button + button { border-left: 1px solid var(--line); }
.tabs button:hover { background: var(--hover); }
.tabs button.on { background: #5b6470; color: #fff; }
.search { flex: 1 1 200px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.short { display: none; }
@media (max-width: 520px) { .short { display: inline; } .long { display: none; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: grid; gap: 10px; }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
.card h3 { margin: 0; font-size: 17px; }
.avg { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.stars { display: inline-flex; font-size: 18px; line-height: 1; }
.star { position: relative; color: var(--off); }
.star i { position: absolute; inset: 0; overflow: hidden; color: var(--accent); font-style: normal; }
.desc { margin: 0; white-space: pre-line; color: var(--fg); }
.desc.clamp { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.more { justify-self: start; border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; font-size: 13px; }
.meta { display: grid; gap: 2px; font-size: 14px; }
.meta a { color: inherit; text-underline-offset: 2px; }
.card-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; border-top: 1px solid var(--line); padding-top: 10px; }
.rate { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.rate .stars button { border: 0; background: none; padding: 0 1px; font-size: 20px; color: var(--off); }
.rate .stars button.lit { color: var(--accent); }
.fav { border: 0; background: none; font-size: 20px; line-height: 1; color: var(--off); padding: 0; }
.fav.on { color: var(--heart); }
.by { color: var(--muted); font-size: 12px; }
.own { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: 14px; }
.own button { border: 0; background: none; padding: 0; }
.own .edit { color: var(--fg); text-decoration: underline; text-underline-offset: 2px; }
.own .del { color: var(--danger); }
.confirm { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--danger); }
.confirm button { border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; background: var(--surface); }
.confirm .yes { background: var(--danger); color: #fff; border-color: var(--danger); }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; font-weight: 400; }
.empty { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 32px; text-align: center; color: var(--muted); }

/* Crew chat */
.side .side-chat { margin: 16px 12px 0; width: calc(100% - 24px); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.teaser { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.teaser:hover { background: var(--hover); }
.teaser-ico { position: relative; flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; background: var(--brand); display: grid; place-items: center; font-size: 20px; }
.teaser-ico i { position: absolute; top: 0; right: 0; width: 12px; height: 12px; border-radius: 50%; background: #22c55e; border: 2px solid var(--surface); }
.teaser-body { flex: 1; min-width: 0; display: grid; gap: 2px; font-size: 14px; }
.teaser-last { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.teaser-last em { font-style: normal; font-weight: 600; color: var(--fg); }
.teaser-time { flex-shrink: 0; font-size: 12px; color: var(--muted); }
.teaser-go { flex-shrink: 0; color: var(--muted); }
.chat { display: flex; flex-direction: column; height: calc(100dvh - 17rem); min-height: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
@media (min-width: 761px) { .chat { height: calc(100dvh - 12rem); } }
.chat-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 3px; }
.chat-empty { margin: auto; color: var(--muted); text-align: center; font-size: 14px; }
.day { text-align: center; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
.msg-row { display: flex; justify-content: flex-start; }
.msg-row.mine { justify-content: flex-end; }
.msg-row.gap { margin-top: 8px; }
.bubble { max-width: 80%; background: var(--hover); border-radius: 16px 16px 16px 4px; padding: 7px 12px; min-width: 0; }
.mine .bubble { background: var(--brand); color: var(--brand-fg); border-radius: 16px 16px 4px 16px; }
.bubble .who { font-size: 12px; font-weight: 700; color: var(--brand-light); }
.bubble p { margin: 0; font-size: 14px; white-space: pre-line; overflow-wrap: anywhere; }
.meta-line { display: flex; justify-content: flex-end; gap: 8px; font-size: 11px; opacity: .7; margin-top: 2px; }
.mdel { border: 0; background: none; padding: 0; color: inherit; text-decoration: underline; font-size: 11px; }
.chat-form { border-top: 1px solid var(--line); background: var(--bg); padding: 10px 12px; }
.chat-input { display: flex; gap: 8px; align-items: flex-end; }
.chat-input textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 14px; max-height: 8rem; }
.chat-hint { margin: 6px 0 0; font-size: 11px; color: var(--muted); }
.dest .chat-live { position: absolute; top: 64px; right: 14px; background: #22c55e; color: #fff; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,.25); }

/* Comments */
.comments { display: grid; gap: 10px; }
.com-toggle { justify-self: start; border: 0; background: none; padding: 0; color: var(--muted); font-size: 14px; }
.com-toggle:hover { color: var(--fg); }
.com-list { display: grid; gap: 8px; }
.com { background: var(--hover); border-radius: 8px; padding: 8px 12px; display: grid; gap: 2px; min-width: 0; }
.com-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; color: var(--muted); }
.com-head b { color: var(--fg); }
.com-stars { color: var(--accent); letter-spacing: 1px; }
.com p { margin: 0; font-size: 14px; white-space: pre-line; overflow-wrap: anywhere; }
.com-del { margin-left: auto; display: flex; gap: 12px; }
.com-del button { border: 0; background: none; padding: 0; font-size: 12px; color: var(--muted); }
.com-del .danger { color: var(--danger); }
.com-form { display: grid; gap: 8px; }
.com-form textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 12px; font-size: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Form */
form.entry { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 24px; display: grid; gap: 16px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field span { font-size: 13px; font-weight: 600; }
.field input, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.err { color: var(--danger); font-size: 13px; }
.actions { display: flex; justify-content: flex-end; gap: 12px; }
.ghost { border: 0; background: none; padding: 9px 14px; border-radius: 8px; }
.ghost:hover { background: var(--hover); }

.info-box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; white-space: pre-line; }

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function cat(slug) { return CATS.filter(function (c) { return c.slug === slug; })[0]; }
  function dest(code) { return DESTS.filter(function (d) { return d.code === code; })[0]; }
  function allRatings(e) { return e.myRating ? e.ratings.concat([e.myRating]) : e.ratings; }
  function avg(e) { var r = allRatings(e); return r.length ? r.reduce(function (a, b) { return a + b; }, 0) / r.length : 0; }
  function count(d, c) { return S.entries.filter(function (e) { return e.dest === d && (!c || e.cat === c); }).length; }
  function fmtDate(iso) { var p = iso.split("-"); return p[2] + "." + p[1] + "." + p[0]; }

  function starsHtml(v) {
    var h = '<span class="stars" aria-label="' + v.toFixed(1) + ' von 5 Sternen">';
    for (var i = 1; i <= 5; i++) {
      var f = Math.max(0, Math.min(1, v - (i - 1)));
      h += '<span class="star">★<i style="width:' + (f * 100) + '%">★</i></span>';
    }
    return h + "</span>";
  }

  function header(titleHtml, showBack) {
    return '<header class="top"><div class="top-inner"><div class="crumbs">' +
      (showBack ? '<button class="link back" data-go="home"><img class="brand-ico" src="' + ICON + '" alt="" width="28" height="28"><span class="back-txt">← Alle</span></button>' : "") +
      '<div class="brand-title">' + titleHtml + '</div></div>' +
      '<div class="user"><span class="name">' + esc(ME.name) + '</span><button class="outline-btn" data-act="logout">Abmelden</button></div>' +
      "</div></header>";
  }

  function renderLogin() {
    return '<div class="preview-note">Vorschau mit Beispieldaten. In der echten App läuft die Anmeldung über Microsoft Entra ID.</div>' +
      '<div class="login"><div class="login-card"><img class="login-icon" src="' + ICON + '" alt="" width="96" height="96"><h1 class="login-word wordmark">Touchdown</h1><p>Nightstop-Tipps von Crew für Crew</p>' +
      '<button class="ms-btn" data-act="login"><svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>Mit Firmen-Account anmelden</button>' +
      "</div></div>";
  }

  function renderHome() {
    var total = S.entries.length;
    var tiles = DESTS.map(function (d) {
      var n = count(d.code);
      return '<button class="dest" data-dest="' + d.code + '" aria-label="' + esc(d.city) + ', ' + n + ' Tipps">' + cityArt(d.code) +
        (recentChatCount(d.code) ? '<span class="chat-live">💬 ' + recentChatCount(d.code) + "</span>" : "") +
        '<span class="top-txt"><span class="code">' + d.code + '</span><span class="city">' + esc(d.city) + '</span><span class="country">' + esc(d.country) + '</span></span>' +
        '<span class="bottom-txt"><span class="pill">' + n + (n === 1 ? " Tipp" : " Tipps") + '</span><span class="landmark">' + esc(CITY_STYLE[d.code].tag) + '</span><span class="go">→</span></span></button>';
    }).join("");
    return '<div class="app">' + header(BRAND, false) +
      '<div class="preview-note">Vorschau mit Beispieldaten. Deine Änderungen bleiben nur in diesem Browser.</div>' +
      '<section class="hero"><div class="hero-inner"><span class="eyebrow">Crew Nightstops</span><h1>Wohin geht\'s heute Nacht?</h1>' +
      '<p>Restaurants, Ausflüge und Insidertipps von Kolleg:innen, für jede Destination auf einen Blick.</p>' +
      '<div class="stats"><span><b>' + DESTS.length + '</b>Destinationen</span><span><b>' + total + '</b>Tipps</span><span><b>' + CATS.length + '</b>Kategorien</span></div></div></section>' +
      '<div class="home"><div class="dest-grid">' + tiles + "</div></div></div>";
  }

  function nav() {
    var side = CATS.map(function (c) {
      var n = count(S.dest, c.slug);
      return '<li><button data-cat="' + c.slug + '" class="' + (S.cat === c.slug ? "on" : "") + '"><span class="ico">' + c.icon +
        '</span><span class="lbl">' + esc(c.label) + "</span>" + (n ? '<span class="count">' + n + "</span>" : "") + "</button></li>";
    }).join("");
    var chips = CATS.map(function (c) {
      var n = count(S.dest, c.slug);
      return '<button data-cat="' + c.slug + '" class="' + (S.cat === c.slug ? "on" : "") + '">' + c.icon + " " + esc(c.label) + (n ? " · " + n : "") + "</button>";
    }).join("");
    var chatOn = S.view === "chat" ? "on" : "";
    return '<nav class="chips" aria-label="Kategorien"><button data-chat="1" class="' + chatOn + '">💬 Crew-Chat</button>' + chips + '</nav>' +
      '<nav class="side" aria-label="Kategorien"><button class="side-chat ' + chatOn + '" data-chat="1"><span class="ico">💬</span><span class="lbl">Crew-Chat</span></button><h2>Empfehlungen von Kolleg:innen</h2><ul>' + side + "</ul></nav>";
  }

  function shell(inner) {
    var d = dest(S.dest);
    return '<div class="app">' + header(d.code + " <span>· " + esc(d.city) + "</span>", true) +
      '<div class="body">' + nav() + '<main><div class="wrap">' + inner + "</div></main></div></div>";
  }

  function bestOf(destCode, slug) {
    return S.entries.filter(function (e) { return e.dest === destCode && e.cat === slug && allRatings(e).length; })
      .sort(function (a, b) { return avg(b) - avg(a) || allRatings(b).length - allRatings(a).length; }).slice(0, 2);
  }

  function renderDest() {
    var d = dest(S.dest), st = CITY_STYLE[d.code];
    var big = CATS.filter(function (c) { return c.featured; }).map(function (c, i) {
      var n = count(d.code, c.slug), top = bestOf(d.code, c.slug);
      var tops = top.length
        ? top.map(function (e) { return '<span class="feat-top"><b>★ ' + avg(e).toFixed(1) + "</b> " + esc(e.title) + "</span>"; }).join("")
        : '<span class="feat-top muted">' + (n ? "Noch keine Bewertungen" : "Noch keine Tipps. Teile den ersten!") + "</span>";
      return '<button class="feat" data-cat="' + c.slug + '" style="--c1:' + st.sky[0] + ";--c2:" + st.sky[1] + ";--rot:" + (135 + i * 20) + 'deg">' +
        '<span class="feat-head"><span class="feat-ico">' + c.icon + '</span><span class="feat-n">' + n + (n === 1 ? " Tipp" : " Tipps") + "</span></span>" +
        '<span class="feat-lbl">' + esc(c.label) + '</span><span class="feat-hint">' + esc(c.hint) + "</span>" +
        '<span class="feat-tops">' + tops + "</span></button>";
    }).join("");
    var small = CATS.filter(function (c) { return !c.featured; }).map(function (c) {
      var n = count(d.code, c.slug);
      return '<button class="cat-tile" data-cat="' + c.slug + '"><span class="ico">' + c.icon + '</span><span class="lbl">' + esc(c.label) +
        '</span><span class="n">' + (n ? n + (n === 1 ? " Tipp" : " Tipps") : "Noch leer") + "</span></button>";
    }).join("");
    var info = d.code === "LJU" ? '<div class="info-box">Beispiel für einen Admin-Infotext: Crew-Hotel im Zentrum, Transfer ca. 25 Minuten. Shuttle-Treffpunkt in der Lobby.</div>' : "";
    return shell('<div class="dest-head"><span class="dest-code">' + d.code + '</span><div><h1 class="page">' + esc(d.city) + '</h1><p class="lead">' + esc(d.country) + " · " + count(d.code) + " Tipps von Kolleg:innen</p></div></div>" + info +
      chatTeaser(d) + '<div class="feat-grid">' + big + '</div><h2 class="more-h">Weitere Kategorien</h2><div class="cat-grid">' + small + "</div>");
  }

  function card(e) {
    var a = avg(e), n = allRatings(e).length, own = e.authorId === ME.id;
    var long = e.desc.length > 220 && !S.expanded[e.id];
    var meta = "";
    var maps = e.mapsUrl || (e.address ? "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(e.address) : "");
    if (e.address) meta += "<div>📍 " + esc(e.address) + "</div>";
    if (e.phone) meta += "<div>📞 " + esc(e.phone) + "</div>";
    if (maps) meta += '<div>🗺️ <a href="' + esc(maps) + '" target="_blank" rel="noopener noreferrer">In Google Maps öffnen</a></div>';
    if (e.website) meta += '<div>🔗 <a href="' + esc(e.website) + '" target="_blank" rel="noopener noreferrer">' + esc(e.website.replace(/^https?:\/\//, "")) + "</a></div>";
    var rate = "";
    for (var i = 1; i <= 5; i++) rate += '<button data-rate="' + i + '" data-id="' + e.id + '" class="' + (i <= e.myRating ? "lit" : "") + '" aria-label="' + i + (i === 1 ? " Stern" : " Sterne") + '">★</button>';
    var ownHtml = "";
    if (own) {
      ownHtml = S.confirmDel === e.id
        ? '<span class="own confirm">Wirklich löschen? <button class="yes" data-del-yes="' + e.id + '">Löschen</button><button data-del-no="1">Abbrechen</button></span>'
        : '<span class="own"><button class="edit" data-edit="' + e.id + '">Bearbeiten</button><button class="del" data-del="' + e.id + '">Löschen</button></span>';
    }
    return '<article class="card" id="' + e.id + '"><div class="card-head"><h3>' + esc(e.title) + (e.example ? '<span class="tag">Beispiel</span>' : "") + "</h3>" +
      '<div class="avg">' + (n ? a.toFixed(1) + " (" + n + ")" + starsHtml(a) : "Noch keine Bewertung") + "</div></div>" +
      '<p class="desc' + (long ? " clamp" : "") + '">' + esc(e.desc) + "</p>" +
      (e.desc.length > 220 ? '<button class="more" data-more="' + e.id + '">' + (long ? "Mehr anzeigen" : "Weniger anzeigen") + "</button>" : "") +
      (meta ? '<div class="meta">' + meta + "</div>" : "") +
      '<div class="card-foot"><div class="rate"><span>' + (e.myRating ? "Deine Bewertung" : "Bewerten") + '</span><span class="stars">' + rate + "</span></div>" +
      '<button class="fav' + (e.fav ? " on" : "") + '" data-fav="' + e.id + '" aria-label="' + (e.fav ? "Aus Favoriten entfernen" : "Zu Favoriten hinzufügen") + '">♥</button>' +
      '<span class="by">von ' + esc(e.author) + " · " + fmtDate(e.created) + "</span>" + ownHtml + "</div>" + commentsHtml(e) + "</article>";
  }

  function commentsHtml(e) {
    var list = e.comments || [], n = list.length, open = !!S.openComments[e.id];
    var h = '<div class="comments"><button class="com-toggle" data-com-toggle="' + e.id + '" aria-expanded="' + open + '">💬 ' +
      (n === 0 ? "Kommentieren" : n + (n === 1 ? " Kommentar" : " Kommentare")) + ' <span aria-hidden="true">' + (open ? "▲" : "▼") + "</span></button>";
    if (!open) return h + "</div>";
    h += '<div class="com-list">';
    list.forEach(function (c) {
      var stars = c.authorId === ME.id ? e.myRating : c.stars;
      var del = "";
      if (c.authorId === ME.id) {
        del = S.confirmCom === c.id
          ? '<span class="com-del"><button class="danger" data-com-del-yes="' + c.id + '" data-entry="' + e.id + '">Wirklich löschen</button><button data-com-del-no="1">Abbrechen</button></span>'
          : '<span class="com-del"><button class="danger" data-com-del="' + c.id + '">Löschen</button></span>';
      }
      h += '<div class="com"><div class="com-head"><b>' + esc(c.author) + "</b>" + (stars ? '<span class="com-stars" aria-label="' + stars + ' Sterne">' + "★".repeat(stars) + "</span>" : "") +
        "<span>" + fmtDate(c.created) + "</span>" + del + '</div><p>' + esc(c.text) + "</p></div>";
    });
    h += '<form class="com-form" data-com-form="' + e.id + '"><label class="sr" for="com-' + e.id + '">Kommentar</label><textarea id="com-' + e.id + '" name="text" rows="2" maxlength="2000" placeholder="Deine Erfahrung, ein Update oder eine Frage…"></textarea>' +
      (S.comErr[e.id] ? '<span class="err">' + esc(S.comErr[e.id]) + "</span>" : "") +
      '<div class="actions"><button type="submit" class="primary">Kommentar senden</button></div></form></div>';
    return h + "</div>";
  }

  function renderList() {
    var c = cat(S.cat), q = S.q.trim().toLowerCase();
    var list = S.entries.filter(function (e) {
      if (e.dest !== S.dest || e.cat !== S.cat) return false;
      if (S.sort === "fav" && !e.fav) return false;
      if (q && (e.title + " " + e.desc + " " + (e.address || "") + " " + (e.comments || []).map(function (c) { return c.text; }).join(" ")).toLowerCase().indexOf(q) === -1) return false;
      return true;
    });
    var byTitle = function (a, b) { return a.title.localeCompare(b.title, "de", { sensitivity: "base" }); };
    list.sort(function (a, b) {
      if (S.sort === "rating") return avg(b) - avg(a) || allRatings(b).length - allRatings(a).length || byTitle(a, b);
      if (S.sort === "new") return b.created < a.created ? -1 : b.created > a.created ? 1 : 0;
      return byTitle(a, b);
    });
    var tabs = [["az", "A–Z", "A–Z"], ["rating", "★ Bewertung", "★"], ["new", "Neueste", "Neu"], ["fav", "♥ Favoriten", "♥"]].map(function (t) {
      return '<button data-sort="' + t[0] + '" class="' + (S.sort === t[0] ? "on" : "") + '"><span class="long">' + t[1] + '</span><span class="short">' + t[2] + "</span></button>";
    }).join("");
    var body = list.length ? list.map(card).join("") :
      '<div class="empty">' + (S.sort === "fav" ? "Du hast hier noch keine Favoriten. Tippe auf ♥ bei einem Eintrag." :
        q ? "Keine Treffer." : "Noch keine Tipps in dieser Kategorie. Sei die erste Person, die einen teilt!") + "</div>";
    return shell('<div class="list-head"><h1 class="page">' + S.dest + ": " + esc(c.label) + '</h1><button class="primary" data-act="new">+ Neuer Tipp</button></div>' +
      '<div class="tools"><div class="tabs" role="tablist">' + tabs + '</div><input id="search" class="search" type="search" placeholder="Suchen…" value="' + esc(S.q) + '"></div>' + body);
  }

  function renderForm() {
    var e = S.editing === "new" ? {} : S.entries.filter(function (x) { return x.id === S.editing; })[0] || {};
    var err = function (k) { return S.errors[k] ? '<span class="err">' + esc(S.errors[k]) + "</span>" : ""; };
    var c = cat(S.cat);
    return shell('<h1 class="page">' + (S.editing === "new" ? "Neuer Tipp: " + S.dest + " · " + esc(c.label) : "Tipp bearbeiten") + "</h1>" +
      '<form class="entry" id="entry-form" novalidate>' +
      '<label class="field"><span>Titel *</span><input id="f-title" name="title" maxlength="150" value="' + esc(e.title) + '" placeholder="z. B. Pizzeria am Fluss">' + err("title") + "</label>" +
      '<label class="field"><span>Beschreibung *</span><textarea id="f-desc" name="desc" rows="6" maxlength="5000" placeholder="Was macht es besonders? Preise, Öffnungszeiten, Weg vom Hotel…">' + esc(e.desc) + "</textarea>" + err("desc") + "</label>" +
      '<div class="grid2">' +
      '<label class="field"><span>Adresse</span><input id="f-address" name="address" value="' + esc(e.address) + '"></label>' +
      '<label class="field"><span>Telefon</span><input id="f-phone" name="phone" type="tel" value="' + esc(e.phone) + '"></label>' +
      '<label class="field"><span>Google-Maps-Link</span><input id="f-maps" name="mapsUrl" value="' + esc(e.mapsUrl) + '" placeholder="https://maps.app.goo.gl/…">' + err("mapsUrl") + "</label>" +
      '<label class="field"><span>Website</span><input id="f-web" name="website" value="' + esc(e.website) + '" placeholder="https://…">' + err("website") + "</label>" +
      '</div><div class="actions"><button type="button" class="ghost" data-act="cancel">Abbrechen</button><button type="submit" class="primary">' +
      (S.editing === "new" ? "Tipp speichern" : "Änderungen speichern") + "</button></div></form>");
  }

  function chatOf(code) { return S.chats.filter(function (m) { return m.dest === code; }).sort(function (a, b) { return a.created < b.created ? -1 : 1; }); }
  function dayLabel(iso) {
    var d = new Date(iso), t = new Date(), y = new Date(); y.setDate(t.getDate() - 1);
    if (d.toDateString() === t.toDateString()) return "Heute";
    if (d.toDateString() === y.toDateString()) return "Gestern";
    return d.toLocaleDateString("de-CH", { weekday: "short", day: "2-digit", month: "2-digit" });
  }
  function timeLabel(iso) { return new Date(iso).toLocaleTimeString("de-CH", { hour: "2-digit", minute: "2-digit" }); }
  function recentChatCount(code) { var since = Date.now() - 864e5; return chatOf(code).filter(function (m) { return new Date(m.created).getTime() >= since; }).length; }

  function chatTeaser(d) {
    var msgs = chatOf(d.code), last = msgs[msgs.length - 1];
    return '<button class="teaser" data-chat="1"><span class="teaser-ico">💬' + (last ? '<i></i>' : "") + '</span><span class="teaser-body"><b>Crew-Chat ' + esc(d.city) + "</b>" +
      (last ? '<span class="teaser-last"><em>' + esc(last.authorId === ME.id ? "Du" : last.author) + ":</em> " + esc(last.text) + "</span>" : '<span class="teaser-last">Noch keine Nachrichten. Schreib die erste!</span>') +
      "</span>" + (last ? '<span class="teaser-time">' + (dayLabel(last.created) === "Heute" ? timeLabel(last.created) : dayLabel(last.created)) + "</span>" : "") + '<span class="teaser-go">→</span></button>';
  }

  function renderChat() {
    var d = dest(S.dest), msgs = chatOf(d.code), h = "";
    msgs.forEach(function (m, i) {
      var prev = msgs[i - 1], mine = m.authorId === ME.id;
      var newDay = !prev || new Date(prev.created).toDateString() !== new Date(m.created).toDateString();
      var same = prev && !newDay && prev.authorId === m.authorId;
      if (newDay) h += '<div class="day">' + dayLabel(m.created) + "</div>";
      var del = mine ? (S.confirmChat === m.id
        ? '<button class="mdel" data-chat-del-yes="' + m.id + '">Löschen?</button><button class="mdel" data-chat-del-no="1">Nein</button>'
        : '<button class="mdel" data-chat-del="' + m.id + '">Löschen</button>') : "";
      h += '<div class="msg-row ' + (mine ? "mine" : "") + (same ? "" : " gap") + '"><div class="bubble">' + (!mine && !same ? '<div class="who">' + esc(m.author) + "</div>" : "") +
        '<p>' + esc(m.text) + '</p><div class="meta-line">' + del + "<span>" + timeLabel(m.created) + "</span></div></div></div>";
    });
    if (!msgs.length) h = '<p class="chat-empty">Noch keine Nachrichten. Bist du gerade in ' + esc(d.city) + "? Schreib die erste Nachricht!</p>";
    return shell('<div><h1 class="page">💬 Crew-Chat ' + d.code + '</h1><p class="lead">Für alle Crews, die gerade in ' + esc(d.city) + " sind: verabreden, Tipps teilen, Taxi teilen.</p></div>" +
      '<div class="chat"><div class="chat-list" id="chat-list">' + h + "</div>" +
      '<form class="chat-form" data-chat-form="1"><div class="chat-input"><label class="sr" for="chat-text">Nachricht</label><textarea id="chat-text" name="text" rows="1" maxlength="1000" placeholder="Nachricht an alle in ' + esc(d.city) + '…"></textarea><button type="submit" class="primary">Senden</button></div>' +
      '<p class="chat-hint">Enter zum Senden. In der Vorschau bleiben Nachrichten nur in deinem Browser, in der echten App sehen sie alle Crews live.</p></form></div>');
  }

  function render() {
    var focusSearch = document.activeElement && document.activeElement.id === "search";
    var pos = focusSearch ? document.activeElement.selectionStart : 0;
    if (!S.loggedIn) root.innerHTML = renderLogin();
    else if (S.view === "home") root.innerHTML = renderHome();
    else if (S.view === "dest") root.innerHTML = renderDest();
    else if (S.view === "form") root.innerHTML = renderForm();
    else if (S.view === "chat") { root.innerHTML = renderChat(); var cl = document.getElementById("chat-list"); if (cl) cl.scrollTop = cl.scrollHeight; }
    else root.innerHTML = renderList();
    if (focusSearch) { var s = document.getElementById("search"); if (s) { s.focus(); s.setSelectionRange(pos, pos); } }
  }

  function go(view) { S.view = view; S.confirmDel = null; S.errors = {}; render(); window.scrollTo(0, 0); }
  function find(id) { return S.entries.filter(function (e) { return e.id === id; })[0]; }

  root.addEventListener("click", function (ev) {
    var t = ev.target.closest("button");
    if (!t) return;
    var d = t.dataset;
    if (d.act === "login") { S.loggedIn = true; persist(); go("home"); }
    else if (d.act === "logout") { S.loggedIn = false; persist(); render(); }
    else if (d.go === "home") go("home");
    else if (d.dest) { S.dest = d.dest; S.cat = null; go("dest"); }
    else if (d.chat) { S.cat = null; go("chat"); }
    else if (d.chatDel) { S.confirmChat = d.chatDel; render(); }
    else if (d.chatDelNo) { S.confirmChat = null; render(); }
    else if (d.chatDelYes) { S.chats = S.chats.filter(function (m) { return m.id !== d.chatDelYes; }); S.confirmChat = null; persist(); render(); }
    else if (d.cat) { S.cat = d.cat; S.sort = "az"; S.q = ""; go("list"); }
    else if (d.sort) { S.sort = d.sort; S.confirmDel = null; render(); }
    else if (d.act === "new") { S.editing = "new"; go("form"); }
    else if (d.act === "cancel") go("list");
    else if (d.edit) { S.editing = d.edit; go("form"); }
    else if (d.del) { S.confirmDel = d.del; render(); }
    else if (d.delNo) { S.confirmDel = null; render(); }
    else if (d.delYes) { S.entries = S.entries.filter(function (e) { return e.id !== d.delYes; }); S.confirmDel = null; persist(); render(); }
    else if (d.rate) { var e = find(d.id); var v = +d.rate; e.myRating = e.myRating === v ? 0 : v; persist(); render(); }
    else if (d.fav) { var f = find(d.fav); f.fav = !f.fav; persist(); render(); }
    else if (d.more) { S.expanded[d.more] = !S.expanded[d.more]; render(); }
    else if (d.comToggle) { S.openComments[d.comToggle] = !S.openComments[d.comToggle]; S.confirmCom = null; render(); }
    else if (d.comDel) { S.confirmCom = d.comDel; render(); }
    else if (d.comDelNo) { S.confirmCom = null; render(); }
    else if (d.comDelYes) { var en = find(d.entry); en.comments = en.comments.filter(function (c) { return c.id !== d.comDelYes; }); S.confirmCom = null; persist(); render(); }
  });

  root.addEventListener("keydown", function (ev) {
    if (ev.target.id === "chat-text" && ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); ev.target.form.requestSubmit(); }
  });

  root.addEventListener("input", function (ev) {
    if (ev.target.id === "search") { S.q = ev.target.value; render(); }
  });

  root.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (ev.target.dataset.chatForm) {
      var ct = ev.target.elements.text.value.trim();
      if (!ct) return;
      S.chats.push({ id: "m" + Date.now(), dest: S.dest, author: ME.name, authorId: ME.id, created: new Date().toISOString(), text: ct });
      persist(); render(); var ta = document.getElementById("chat-text"); if (ta) ta.focus(); return;
    }
    var cf = ev.target.dataset.comForm;
    if (cf) {
      var txt = ev.target.elements.text.value.trim(), en = find(cf);
      if (!txt) { S.comErr[cf] = "Bitte einen Kommentar eingeben"; render(); return; }
      S.comErr[cf] = null;
      en.comments = en.comments || [];
      en.comments.push({ id: "c" + Date.now(), author: ME.name, authorId: ME.id, stars: 0, created: new Date().toISOString().slice(0, 10), text: txt });
      persist(); render(); return;
    }
    var f = ev.target, v = function (n) { return f.elements[n].value.trim(); };
    var errs = {};
    if (v("title").length < 2) errs.title = "Bitte einen Titel eingeben";
    if (v("desc").length < 5) errs.desc = "Bitte eine kurze Beschreibung eingeben";
    ["mapsUrl", "website"].forEach(function (k) { if (v(k) && !/^https?:\/\/\S+$/i.test(v(k))) errs[k] = "Bitte einen Link mit https:// eingeben"; });
    if (Object.keys(errs).length) {
      // keep what was typed
      var keep = { title: v("title"), desc: v("desc"), address: v("address"), phone: v("phone"), mapsUrl: v("mapsUrl"), website: v("website") };
      S.errors = errs; render();
      var g = document.getElementById("entry-form");
      Object.keys(keep).forEach(function (k) { g.elements[k].value = keep[k]; });
      return;
    }
    var data = { title: v("title"), desc: v("desc"), address: v("address") || null, phone: v("phone") || null, mapsUrl: v("mapsUrl") || null, website: v("website") || null };
    if (S.editing === "new") {
      var today = new Date().toISOString().slice(0, 10);
      S.entries.push(Object.assign({ id: "u" + Date.now(), dest: S.dest, cat: S.cat, author: ME.name, authorId: ME.id, created: today, ratings: [], myRating: 0, fav: false, example: false }, data));
      S.sort = "new";
    } else {
      Object.assign(find(S.editing), data);
    }
    persist(); go("list");
  });

  render();
})();
</script>
</body>
</html>
