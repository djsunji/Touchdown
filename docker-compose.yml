# Local PostgreSQL for development: `docker compose up -d`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nightstop
      POSTGRES_PASSWORD: nightstop
      POSTGRES_DB: nightstop
    ports:
      - "127.0.0.1:5432:5432" # only reachable from this machine
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
